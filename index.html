<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cryptid</title>
  <link rel="stylesheet" type="text/css" href="css/cryptid.css">
</head>
<body>
  <h1>Cryptid</h1>

  <div class="container">
    <div class="setup-section" id="setupSection">
      <h2>Setup</h2>
      <label>
        Board:
        <select id="setupMode">
          <option value="auto">Auto</option>
          <option value="manual">Manual</option>
          <option value="random">Random</option>
        </select>
      </label>
      <label>
        Player Count:
        <select id="playerCount">
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
          <option value="5">5 Players</option>
        </select>
      </label>
      <label>
        Highlight Mode:
        <select id="highlightMode">
          <option value="positive">Positive</option>
          <option value="negative">Negative</option>
        </select>
      </label>
      <br/>
      <button id="createGameBtn">Create Game</button>
    </div>

    <canvas id="gameCanvas" class="hidden" width="760" height="700"></canvas>

    <div id="manualSetup" class="hidden p-4">
        <h2 class="text-xl font-bold mb-4">Manual Setup</h2>
        
        <!-- Dropdown Grid -->
        <div id="manualDropdownGrid" class="grid grid-cols-2 gap-4 mb-6"></div>
        
        <!-- Structure Inputs -->
        <div id="manualStructureInputs" class="grid grid-cols-2 gap-4 mb-6"></div>

        <!-- Buttons -->
        <div class="flex gap-4">
            <button id="confirmManualSetupBtn" class="bg-green-600 text-white px-4 py-2 rounded">Confirm</button>
            <button id="resetManualSetupBtn" class="bg-red-600 text-white px-4 py-2 rounded">Reset</button>
        </div>

        <!-- CSV Preview -->
        <pre id="csv-output" class="mt-4 bg-gray-200 p-2 rounded text-sm"></pre>
    </div>

    <div class="player-section hidden" id="playerSection">
        <h2>Player Setup</h2>
        <div id="playerDropdowns" class="player-row"></div>
        <button id="confirmSetupBtn">Confirm</button>
        <button id="resetGameBtn">Reset</button>
        <button id="allSolutions">Find all combos</button>
    </div>

    <script src="js/tile.js" type="text/javascript"></script>
    <script src="js/gameBoard.js" type="text/javascript"></script>
    <script src="js/gameMap.js" type="text/javascript"></script>
    <script src="js/cryptid.js" type="text/javascript"></script>
</body>
</html>
