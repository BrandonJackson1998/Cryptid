<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Dungeon Crawler</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #111;
      color: #0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      margin-top: 20px;
      background: #222;
      border: 2px solid #0f0;
    }
    h1 {
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>🗡️ Mini Dungeon Crawler</h1>
  <p>Use W A S D to move your hero (🧙), defeat enemies (👾), reach the exit (🚪)!</p>
  <canvas id="dungeon" width="320" height="320"></canvas>

  <script>
    const canvas = document.getElementById("dungeon");
    const ctx = canvas.getContext("2d");
    const tileSize = 32;

    const map = [
      "##########",
      "#@   #   #",
      "# ##   # #",
      "#    ##  #",
      "# ##   # #",
      "#   #    #",
      "### ###E #",
      "#        #",
      "#   ##   #",
      "########D#"
    ];

    const hero = { x: 1, y: 1, hp: 3 };
    let gameOver = false;

    function drawTile(x, y, char) {
      ctx.fillStyle = "#111";
      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
      ctx.fillStyle = "#0f0";
      ctx.font = "24px monospace";
      ctx.fillText(char, x * tileSize + 8, y * tileSize + 24);
    }

    function drawMap() {
      for (let y = 0; y < map.length; y++) {
        for (let x = 0; x < map[y].length; x++) {
          let char = map[y][x];
          if (x === hero.x && y === hero.y) char = "🧙";
          else if (char === "#") char = "⬛";
          else if (char === " ") char = "⬜";
          else if (char === "E") char = "👾";
          else if (char === "D") char = "🚪";
          drawTile(x, y, char);
        }
      }
    }

    function moveHero(dx, dy) {
      if (gameOver) return;
      const newX = hero.x + dx;
      const newY = hero.y + dy;
      const destination = map[newY][newX];
      if (destination === "#") return;
      if (destination === "E") {
        hero.hp--;
        alert("You fought an enemy! HP: " + hero.hp);
        if (hero.hp <= 0) {
          gameOver = true;
          alert("You died! Game Over.");
          return;
        }
        map[newY] = map[newY].substring(0, newX) + " " + map[newY].substring(newX + 1);
      }
      if (destination === "D") {
        gameOver = true;
        alert("You escaped the dungeon! Victory!");
        return;
      }
      hero.x = newX;
      hero.y = newY;
    }

    document.addEventListener("keydown", e => {
      if (e.key === "w") moveHero(0, -1);
      else if (e.key === "s") moveHero(0, 1);
      else if (e.key === "a") moveHero(-1, 0);
      else if (e.key === "d") moveHero(1, 0);
      drawMap();
    });

    drawMap();
  </script>
</body>
</html>
