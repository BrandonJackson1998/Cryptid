<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Dodger</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #111;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>
  <h1>🚀 Space Dodger</h1>
  <p>Use left/right arrows to dodge asteroids!</p>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let spaceship = {
      x: 180,
      y: 550,
      width: 40,
      height: 20,
      speed: 5
    };

    let keys = {};
    let asteroids = [];
    let score = 0;
    let gameOver = false;

    function createAsteroid() {
      asteroids.push({
        x: Math.random() * 360,
        y: -20,
        size: 20 + Math.random() * 20,
        speed: 2 + Math.random() * 3
      });
    }

    function drawSpaceship() {
      ctx.fillStyle = "cyan";
      ctx.fillRect(spaceship.x, spaceship.y, spaceship.width, spaceship.height);
    }

    function drawAsteroids() {
      ctx.fillStyle = "red";
      for (let a of asteroids) {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function update() {
      if (keys["ArrowLeft"] && spaceship.x > 0) spaceship.x -= spaceship.speed;
      if (keys["ArrowRight"] && spaceship.x < canvas.width - spaceship.width)
        spaceship.x += spaceship.speed;

      for (let a of asteroids) {
        a.y += a.speed;
        if (
          a.x < spaceship.x + spaceship.width &&
          a.x + a.size > spaceship.x &&
          a.y < spaceship.y + spaceship.height &&
          a.y + a.size > spaceship.y
        ) {
          gameOver = true;
        }
      }

      asteroids = asteroids.filter(a => a.y < canvas.height);

      if (!gameOver) score++;
    }

    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + score, 10, 30);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSpaceship();
      drawAsteroids();
      drawScore();
      if (!gameOver) {
        update();
        requestAnimationFrame(gameLoop);
      } else {
        ctx.fillStyle = "yellow";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 80, 300);
      }
    }

    setInterval(createAsteroid, 1000);
    document.addEventListener("keydown", e => (keys[e.key] = true));
    document.addEventListener("keyup", e => (keys[e.key] = false));

    gameLoop();
  </script>
</body>
</html>
